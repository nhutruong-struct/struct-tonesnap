# Dependency policy, checked by `cargo deny check` (the `deps` gate of check.mjs --full).

[graph]
# The shipped target. macOS joins in Phase 3.
targets = ["x86_64-pc-windows-msvc"]

[advisories]
# Known vulnerabilities (RustSec) always fail. Unmaintained or yanked crates fail only when we
# depend on them directly: deep in Tauri's tree they are not ours to replace.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# ToneSnap may ship closed source to companies (Phase 4), so only permissive licenses, plus
# MPL-2.0 (Tauri's HTML tooling), whose copyleft covers changes to its own files only.
# A license no dependency uses is left out; add one when a reviewed dependency needs it.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "BSD-3-Clause",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
  "0BSD",
  "Unlicense",
]
confidence-threshold = 0.9
# The app itself is not published (`publish = false`), so it needs no license field.
private = { ignore = true }

[bans]
# Tauri pulls several versions of some crates; that is not actionable from here.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
