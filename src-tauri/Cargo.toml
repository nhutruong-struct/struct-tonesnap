[package]
name = "tonesnap"
version = "1.1.4"
description = "Select English text anywhere and get better phrasings in the tone you need"
authors = ["Nhu Truong"]
license = "MIT"
repository = "https://github.com/nhutruong-struct/struct-tonesnap"
edition = "2021"
# An app, never published to crates.io.
publish = false

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tonesnap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
regex = "1"
# Default TLS is the OS stack (SChannel / Security.framework), so corporate TLS-inspection
# roots installed in the OS trust store (e.g. Netskope, Zscaler) are honored.
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
keyring = { version = "3", features = ["windows-native", "apple-native"] }
sys-locale = "0.3"

# Same major version as Tauri's own `windows` dependency so it is compiled once.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
] }

# Already compiled for Tauri (same versions, same lockfile entries); only the classes we call are on.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSGeometry", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "block2", "NSApplication", "NSBitmapImageRep", "NSColor", "NSControl", "NSCursor", "NSEvent", "NSGraphics", "NSImage", "NSImageRep", "NSImageView", "NSPanel", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSRunningApplication", "NSScreen", "NSView", "NSWindow", "NSWorkspace"] }
block2 = "0.6"
dispatch2 = "0.3"
# New for the macOS OCR: Vision recognizes the text, ScreenCaptureKit captures the pixels.
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage"] }
objc2-vision = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "objc2-core-graphics", "VNObservation", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler", "VNTypes"] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "objc2-core-graphics", "SCScreenshotManager", "SCShareableContent", "SCStream"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
# The OS TLS stack instead of the default rustls, for the same reason as reqwest above; `zip`
# is left out because Windows updates are the installers themselves.
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Code rules clippy checks exactly; scripts/harness/invariants.mjs covers the ones it cannot
# (unwrap only after a mutex lock, unsafe only in platform/, privacy of eprintln!, hosts).
[lints.clippy]
dbg_macro = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
panic = "deny"
allow_attributes_without_reason = "deny"
# Every unsafe block says why it is sound (handles valid, buffers sized, COM initialized…).
undocumented_unsafe_blocks = "deny"
