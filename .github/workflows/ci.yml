name: CI

on:
  push:
    branches: [develop, master]
  # `edited` re-runs the job when the title changes, because the title becomes the squashed commit message.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

# Pull requests from forks run with a read-only token and no secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # The name is the required status check in the branch rulesets; rename both together.
    name: check
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      # Cheap, so it comes first. The title is passed through the environment, never interpolated into the script.
      - name: Check the pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: node scripts/harness/check.mjs --only=pr-title

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # tauri-build embeds dist/, so the frontend is built before clippy and the Rust tests.
      - name: Build the frontend
        run: node node_modules/vite/bin/vite.js build

      # Invariants (project rules, whitespace, suppressions, secrets), rustfmt, Prettier, tsc, ESLint, clippy,
      # Rust unit tests, vitest and the harness's own tests. The Win32 integration tests (check.mjs --full)
      # need an interactive desktop and run locally before a PR.
      - name: Run the quality gates
        run: node scripts/harness/check.mjs

  # The same gates on a Mac, so the macOS layer (platform/mac) is linted and tested. Not a required
  # check: the rulesets name only `check`.
  check-macos:
    name: check (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the frontend
        run: node node_modules/vite/bin/vite.js build

      - name: Run the quality gates
        run: node scripts/harness/check.mjs
