name: Fuzz

# Fuzzes the reversible redaction (src-tauri/src/redact.rs) with cargo-fuzz and libFuzzer: briefly on pull
# requests that touch it, longer every week. A crash uploads the input that caused it as an artifact.
on:
  pull_request:
    paths:
      - src-tauri/src/redact.rs
      - src-tauri/fuzz/**
      - .github/workflows/fuzz.yml
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: fuzz
    # The fuzz targets compile the app's modules without Tauri, so Linux needs no GTK or WebKit.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && '60' || '900' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cargo-fuzz needs nightly for the sanitizer and coverage flags.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Fuzz the redaction
        working-directory: src-tauri
        run: cargo fuzz run redact -- -max_total_time="$FUZZ_SECONDS"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-artifacts
          path: src-tauri/fuzz/artifacts
          retention-days: 14
