name: Release

# Builds the Windows installers in GitHub Actions, never on a personal machine. A pull request that changes
# this file only builds them (as a check); a push to master (the merge of a release PR) builds them, attests
# their provenance and publishes the GitHub release `v<version>` with the notes from CHANGELOG.md, which also
# creates the tag. A push whose version already has a release (a merge without a version bump) builds nothing.
# Releases are immutable once published. The tag ruleset lets only admins and this workflow create `v*` tags.
#
# A release also carries what the in-app updater needs (src-tauri/src/update.rs): a minisign `.sig` for each
# installer and `latest.json`, which the app reads from releases/latest/download/. The signing key is the
# TAURI_SIGNING_PRIVATE_KEY secret of the `release` environment (deployable from master only). Only the `sign`
# job sees it, in one step that runs nothing but the Tauri CLI, so no build script or dependency of the build
# ever has it.
on:
  push:
    branches: [master]
  pull_request:
    paths: [".github/workflows/release.yml", "src-tauri/tauri.conf.json"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Decides whether this run releases: only on master (reached through a reviewed PR), and only when the
  # version the app reports has no published release yet.
  plan:
    name: plan the release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the version and check it can be released
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF}" != "refs/heads/master" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(gh release view "v${version}" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null)" = "false" ]; then
            echo "::notice::v${version} is already released, so nothing is built. Bump the version to release again."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for ${version}"
            exit 1
          fi
          pubkey="$(node -p "require('./src-tauri/tauri.conf.json').plugins.updater.pubkey")"
          if [ -z "${pubkey}" ]; then
            echo "::error::plugins.updater.pubkey in tauri.conf.json is empty, so the app could not verify updates"
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

  build:
    name: build installers
    needs: plan
    if: github.event_name == 'pull_request' || needs.plan.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      # No build cache: a release is always built from scratch, so nothing from another run can end up in it.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the installers
        run: pnpm tauri build

      - name: Collect the installers and checksums
        shell: bash
        run: |
          mkdir -p release
          cp src-tauri/target/release/bundle/nsis/*.exe release/
          cp src-tauri/target/release/bundle/msi/*.msi release/
          cd release
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers
          path: release/
          if-no-files-found: error
          retention-days: 14

  sign:
    name: sign for the updater
    if: needs.plan.outputs.release == 'true'
    needs: [plan, build]
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Only the Tauri CLI is needed, and its install runs no scripts.
      - name: Install the Tauri CLI
        run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installers
          path: release

      # The signature names the version, which the app requires (`requireSignedVersion`).
      - name: Sign the installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set in the release environment"
            exit 1
          fi
          mkdir signatures
          for installer in release/*.exe release/*.msi; do
            node_modules/.bin/tauri signer sign --app-version "${VERSION}" "$installer"
            mv "$installer.sig" signatures/
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signatures
          path: signatures/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish release
    if: needs.plan.outputs.release == 'true'
    needs: [plan, build, sign]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installers
          path: release

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signatures
          path: release

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.exe
            release/*.msi

      # Notes are the CHANGELOG.md section of this version. The release is created as a draft, the files
      # are attached, and only then is it published (which creates the tag on this commit), because a
      # published release is immutable. A draft left by a failed run is replaced.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          version="${VERSION}"
          TAG="v${version}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${version}"
            exit 1
          fi
          # The manifest the in-app updater reads; it fails when an installer has no signature.
          node scripts/release/updater-manifest.mjs "$version" release notes.md "$GITHUB_REPOSITORY"
          # The `.sig` files stay out: latest.json carries the signatures, and fewer assets tell a visitor
          # which file to download.
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null)" = "true" ]; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "$TAG" release/*.exe release/*.msi release/SHA256SUMS.txt release/latest.json --repo "$GITHUB_REPOSITORY" --title "ToneSnap ${version}" \
            --notes-file notes.md --target "$GITHUB_SHA" --draft
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
