name: Feature request
description: Propose a concrete improvement. Open-ended ideas fit better in Discussions → Ideas.
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! You can write in English or Vietnamese.
        If the idea still needs shaping, start a thread in [Discussions → Ideas](https://github.com/nhutruong-struct/struct-tonesnap/discussions/categories/ideas) first.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
      placeholder: When I reply in Teams I often want…
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The proposal
      description: What should ToneSnap do? Describe the behavior the user sees.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: textarea
    id: privacy
    attributes:
      label: Privacy impact
      description: Would this read more text, send data somewhere new, or store anything? Say "none" if not.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to implement this myself (a maintainer will confirm the approach first).
