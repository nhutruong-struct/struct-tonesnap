version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    target-branch: develop
    schedule:
      interval: weekly
    labels: ["dependencies", "rust"]
    open-pull-requests-limit: 5
    ignore:
      # Must stay on the version Tauri itself uses (AGENTS.md, invariant 5); updated together with Tauri.
      - dependency-name: windows
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # reqwest 0.13 defaults to rustls; ToneSnap must keep the OS TLS stack (AGENTS.md, invariant 6).
      # Upgrade by hand, keeping native TLS.
      - dependency-name: reqwest
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      tauri:
        patterns: ["tauri", "tauri-*"]
      rust-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: cargo
    directory: /src-tauri/fuzz
    target-branch: develop
    schedule:
      interval: monthly
    labels: ["dependencies", "rust"]
    groups:
      fuzz:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    labels: ["dependencies", "javascript"]
    open-pull-requests-limit: 5
    groups:
      tauri:
        patterns: ["@tauri-apps/*"]
      js-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /video
    target-branch: develop
    schedule:
      interval: monthly
    labels: ["dependencies", "javascript"]
    groups:
      video:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    labels: ["dependencies", "github-actions"]
